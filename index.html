<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>FilmShark - Watch Free HD Movies & TV Shows Online (No Sign-Up)</title>
    <meta name="description" content="Stream thousands of trending movies and TV series in 4K & HD quality on FilmShark. Zero subscriptions, no registration required. High speed streaming on any device." />
    <meta name="keywords" content="watch movies online, free streaming, hd movies, watch tv series, stream anime free, kdrama streaming, filmshark, zero ads" />
    <meta name="author" content="FilmShark" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#060a0f" />
    <link rel="canonical" href="https://filmshark.pages.dev/" />

    <!-- ── Progressive Web App (PWA) Directives ───────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FilmShark" />
    <link rel="apple-touch-icon" href="/logo icon.svg" />

    <!-- ── Security Directives ───────────────────────────────── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()" />

    <!-- ── Social / Open Graph SEO ───────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FilmShark" />
    <meta property="og:title" content="FilmShark - Watch Free HD Movies & TV Shows Online" />
    <meta property="og:description" content="Stream the latest blockbuster movies and trending TV shows in 4K & HD quality on FilmShark. Zero subscriptions, no registration required." />
    <meta property="og:url" content="https://filmshark.pages.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/Logo.svg" />

    <!-- ── Twitter Card SEO ──────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FilmShark - Watch Free HD Movies & TV Shows" />
    <meta name="twitter:description" content="Stream thousands of movies and series in 4K & HD quality with no registration." />
    <meta name="twitter:image" content="/Logo.svg" />

    <!-- ── Performance & CDN Preconnects ─────────────────────── -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo icon.svg" />

    <!-- ── PropellerAds (replace ZONE_ID after registration) ─────── -->
    <!-- Step 1: preconnect so the script loads fast -->
    <link rel="preconnect" href="https://a.propellerads.com" crossorigin />
    <!-- Step 2: async script — does NOT block rendering -->
    <script async src="https://a.propellerads.com/ZONE_ID.js" data-propellerads-zone="ZONE_ID"></script>
    <!-- ─────────────────────────────────────────────────────────── -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
